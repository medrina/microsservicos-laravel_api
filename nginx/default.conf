server {
    listen 80;
    server_name localhost;

    # Remove a versão do Nginx dos cabeçalhos HTTP
    server_tokens off;

    # --------------------------------------------------
    # Microsserviço: MSCLIENTES
    # --------------------------------------------------
    location /msclientes {
        alias /var/www/public;
        try_files $uri $uri/ @msclientes_laravel;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass msclientes:9000;
            # Força o PHP-FPM do container a ler o index.php correto
            fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        }
    }

    # Rota fallback que limpa o caminho e entrega para o index.php do container
    location @msclientes_laravel {
        include fastcgi_params;
        fastcgi_pass msclientes:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        # Passa a query string original mantendo o path esperado pelo Laravel
        fastcgi_param REQUEST_URI $request_uri; 
    }

    # --------------------------------------------------
    # Microsserviço: MSCARTOES
    # --------------------------------------------------
    location /mscartoes {
        alias /var/www/public;
        try_files $uri $uri/ @mscartoes_laravel;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass mscartoes:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        }
    }

    location @mscartoes_laravel {
        include fastcgi_params;
        fastcgi_pass mscartoes:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # --------------------------------------------------
    # Microsserviço: MSAVALIADOR
    # --------------------------------------------------
    location /msavaliador {
        alias /var/www/public;
        try_files $uri $uri/ @msavaliador_laravel;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass msavaliador:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        }
    }

    location @msavaliador_laravel {
        include fastcgi_params;
        fastcgi_pass msavaliador:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }
}
