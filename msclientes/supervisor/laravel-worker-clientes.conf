[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true

[program:msclientes-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work rabbitmq --sleep=3 --tries=3
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/worker.log
stopwaitsecs=3600

# Como identificar os microsserviços nos logs do Docker?
# Se o seu objetivo é saber qual microsserviço está rodando qual fila ao olhar os logs no terminal (docker logs), a solução correta é fazer o 
# Docker redirecionar a saída do Supervisor para o próprio terminal.
# Para fazer isso, altere as linhas de log no seu laravel-worker.conf para apontar para o terminal do Linux (/dev/stdout e /dev/stderr):
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0