# Âncora de configuração: Define o limite global de logs. Definição do modelo padrão de logs (30MB no máximo por container)
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"  # Cada arquivo de log terá no máximo 10 Megabytes
      max-file: "3"    # Mantém no máximo 3 arquivos (rotatividade). Total: 30MB por contêiner.

# MICROSSERVIÇO MSCLIENTES
services:
  msclientes:
    <<: *default-logging # Aplica o limite de logs aqui também
    deploy:
      resources:
        limits:
          memory: 256M # estabelece limite de memória do container do microsserviço MSCLIENTES
    environment:
      - COMPOSER_PROCESS_TIMEOUT=0
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      args:
        - SUPERVISOR_FILE=laravel-worker-clientes.conf
        - MICROSERVICE=msclientes
    container_name: msclientes
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./msclientes:/var/www
    depends_on:
      db_msclientes:
        condition: service_healthy
    networks:
      - laravel_mysql
#--------------------------------------------------------------------------------
# MICROSSERVIÇO MSCARTOES
  mscartoes:
    <<: *default-logging # Aplica o limite de logs aqui também
    deploy:
      resources:
        limits:
          memory: 256M # estabelece limite de memória do container do microsserviço MSCARTOES
    environment:
      - COMPOSER_PROCESS_TIMEOUT=0
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      args:
        - SUPERVISOR_FILE=laravel-worker-cartoes.conf
        - MICROSERVICE=mscartoes
    container_name: mscartoes
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./mscartoes:/var/www
    depends_on:
      db_mscartoes:
        condition: service_healthy
    networks:
      - laravel_mysql
#--------------------------------------------------------------------------------
# MICROSSERVIÇO MSAVALIADOR
  msavaliador:
    <<: *default-logging # Aplica o limite de logs aqui também
    deploy:
      resources:
        limits:
          memory: 256M # estabelece limite de memória do container do microsserviço MSAVALIADOR
    environment:
      - COMPOSER_PROCESS_TIMEOUT=0
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      args:
        - SUPERVISOR_FILE=laravel-worker-avaliador.conf
        - MICROSERVICE=msavaliador
    container_name: msavaliador
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./msavaliador:/var/www
    depends_on:
      db_msavaliador:
        condition: service_healthy
    networks:
      - laravel_mysql
#--------------------------------------------------------------------------------
# SERVIDOR WEB NGINX
  nginx:
    image: nginx:alpine
    <<: *default-logging # Aplica o limite de logs declarado globalmente no início do código
    deploy:
      resources:
        limits:
          memory: 128M
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./msclientes:/var/www/msclientes
      - ./mscartoes:/var/www/mscartoes
      - ./msavaliador:/var/www/msavaliador
    depends_on:
      - msclientes
      - mscartoes
      - msavaliador
    networks:
      - laravel_mysql
#--------------------------------------------------------------------------------
# SERVIÇO DE MENSAGERIA
  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine
    <<: *default-logging # Protege contra o alto volume de conexões/filas
    container_name: rabbitmq
    ports: 
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - mariadb_rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./rabbitmq/rabbitmq.config:/etc/rabbitmq/rabbitmq.config
    networks:
      - laravel_mysql
#--------------------------------------------------------------------------------
# SERVIÇO DE CACHE DE TOKENS JWT INVÁLIDOS EM MEMÓRIA
  redis:
    image: redis:alpine
    <<: *default-logging # Aplica o limite de logs aqui também
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru # limite interno de memória do Redis = 100 MB
    deploy:
      resources:
        limits:
          memory: 128M # limite de memória do container
    container_name: redis
    ports:
      - "6379:6379"
    networks:  
      - laravel_mysql
#--------------------------------------------------------------------------------
# BANCO DE DADOS DO MICROSSERVIÇO MSCLIENTES
  db_msclientes:
    image: mariadb:12.3
    <<: *default-logging # Protege contra abuso de logs de query/erros
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    container_name: db_msclientes
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: msclientes
      MARIADB_ROOT_PASSWORD: root
      MARIADB_PASSWORD: root
      MARIADB_USER: msclientes
    ports:
      - "3306:3306"
    volumes:
      - mariadb_msclientes:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - laravel_mysql
