#--------------------------------------------------------------------------------
# REDE INTERNA DOS CONTAINERS 
networks:
  laravel_mysql:
    name: api_laravel
    driver: bridge
#--------------------------------------------------------------------------------
# VOLUMES DE DADOS DOS CONTAINERS
volumes:
  mariadb_mscartoes:
  mariadb_msclientes:
  mariadb_msavaliador:
  mariadb_rabbitmq_data:
