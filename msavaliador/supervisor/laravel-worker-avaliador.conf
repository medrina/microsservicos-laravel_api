[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true

[program:msavaliador-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work rabbitmq --sleep=3 --tries=3
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[supervisord]
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700